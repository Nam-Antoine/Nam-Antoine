<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="196" viewBox="0 0 900 196" role="img">

<defs>
  <linearGradient id="stack-glass-light-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf1fc"/><stop offset="1" stop-color="#f7f9ff"/></linearGradient>
  <linearGradient id="stack-glass-light-edge" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="rgba(255,255,255,1)"/><stop offset="0.45" stop-color="rgba(17,85,188,0.14)"/><stop offset="1" stop-color="rgba(255,255,255,1)" stop-opacity="0.6"/></linearGradient>
  <linearGradient id="stack-glass-light-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(255,255,255,0.7)" stop-opacity="0"/><stop offset="0.5" stop-color="rgba(255,255,255,0.7)"/><stop offset="1" stop-color="rgba(255,255,255,0.7)" stop-opacity="0"/></linearGradient>
  <linearGradient id="stack-glass-light-top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="stack-glass-light-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="46"/></filter>
  <filter id="stack-glass-light-shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.18"/></filter>
  <clipPath id="stack-glass-light-clip"><rect width="900" height="196" rx="24"/></clipPath>
</defs>
<style>
  .blob { filter: url(#stack-glass-light-blur); opacity: 0.45; mix-blend-mode: screen; }
  @keyframes stack-glass-light-drift0 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(70px,-40px) scale(1.15)} 100%{transform:translate(0,0) scale(1)} }
  @keyframes stack-glass-light-drift1 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-90px,30px) scale(0.9)} 100%{transform:translate(0,0) scale(1)} }
  @keyframes stack-glass-light-drift2 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(40px,60px) scale(1.2)} 100%{transform:translate(0,0) scale(1)} }
  @keyframes stack-glass-light-drift3 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-50px,-60px) scale(1.05)} 100%{transform:translate(0,0) scale(1)} }
  .b0{animation:stack-glass-light-drift0 14s ease-in-out infinite} .b1{animation:stack-glass-light-drift1 17s ease-in-out infinite}
  .b2{animation:stack-glass-light-drift2 19s ease-in-out infinite} .b3{animation:stack-glass-light-drift3 15s ease-in-out infinite}
  @keyframes stack-glass-light-sweep { 0%{transform:translateX(-900px) skewX(-18deg)} 35%,100%{transform:translateX(1080px) skewX(-18deg)} }
  .sheen { animation: stack-glass-light-sweep 7s cubic-bezier(.4,0,.2,1) infinite; }
  
  @keyframes stack-glass-light-rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .rise { animation: stack-glass-light-rise .8s cubic-bezier(.2,.7,.2,1) both; }
  .d1{animation-delay:.1s} .d2{animation-delay:.25s} .d3{animation-delay:.4s} .d4{animation-delay:.55s} .d5{animation-delay:.7s} .d6{animation-delay:.85s}
  text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif; }
</style>
<rect width="900" height="196" rx="24" fill="url(#stack-glass-light-bg)"/>
<g clip-path="url(#stack-glass-light-clip)"><circle class="blob b0" cx="100" cy="150" r="150" fill="#1155BC" /><circle class="blob b1" cx="500" cy="0" r="160" fill="#38bdf8" /><circle class="blob b2" cx="850" cy="140" r="140" fill="#a78bfa" /><circle class="blob b3" cx="300" cy="80" r="100" fill="#60a5fa" /></g>

<g filter="url(#stack-glass-light-shadow)">
  <rect x="16" y="16" width="868" height="164" rx="22" fill="rgba(255,255,255,0.55)" stroke="url(#stack-glass-light-edge)" stroke-width="1.2"/>
</g>
<rect x="17" y="17" width="866" height="28" rx="21" fill="url(#stack-glass-light-top)" opacity="0.5"/>
<clipPath id="stack-glass-light-p16-16"><rect x="16" y="16" width="868" height="164" rx="22"/></clipPath>
<g clip-path="url(#stack-glass-light-p16-16)"><rect class="sheen" x="16" y="-4" width="156.23999999999998" height="204" fill="url(#stack-glass-light-sheen)"/></g>

