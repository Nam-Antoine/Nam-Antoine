<style>@keyframes act-glass-dark-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}} .bar{transform-origin:520px 0;animation:act-glass-dark-grow 1.2s cubic-bezier(.2,.7,.2,1) both}</style>

