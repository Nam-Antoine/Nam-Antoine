<defs>
  <linearGradient id="act-glass-dark-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070c18"/><stop offset="1" stop-color="#0d1630"/></linearGradient>
  <linearGradient id="act-glass-dark-edge" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="rgba(255,255,255,0.55)"/><stop offset="0.45" stop-color="rgba(255,255,255,0.08)"/><stop offset="1" stop-color="rgba(255,255,255,0.55)" stop-opacity="0.6"/></linearGradient>
  <linearGradient id="act-glass-dark-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(255,255,255,0.22)" stop-opacity="0"/><stop offset="0.5" stop-color="rgba(255,255,255,0.22)"/><stop offset="1" stop-color="rgba(255,255,255,0.22)" stop-opacity="0"/></linearGradient>
  <linearGradient id="act-glass-dark-top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="act-glass-dark-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="46"/></filter>
  <filter id="act-glass-dark-shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/></filter>
  <clipPath id="act-glass-dark-clip"><rect width="900" height="200" rx="24"/></clipPath>
</defs>
<style>
  .blob { filter: url(#act-glass-dark-blur); opacity: 0.85; mix-blend-mode: screen; }
  @keyframes act-glass-dark-drift0 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(70px,-40px) scale(1.15)} 100%{transform:translate(0,0) scale(1)} }
  @keyframes act-glass-dark-drift1 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-90px,30px) scale(0.9)} 100%{transform:translate(0,0) scale(1)} }
  @keyframes act-glass-dark-drift2 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(40px,60px) scale(1.2)} 100%{transform:translate(0,0) scale(1)} }
  @keyframes act-glass-dark-drift3 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-50px,-60px) scale(1.05)} 100%{transform:translate(0,0) scale(1)} }
  .b0{animation:act-glass-dark-drift0 14s ease-in-out infinite} .b1{animation:act-glass-dark-drift1 17s ease-in-out infinite}
  .b2{animation:act-glass-dark-drift2 19s ease-in-out infinite} .b3{animation:act-glass-dark-drift3 15s ease-in-out infinite}
  @keyframes act-glass-dark-sweep { 0%{transform:translateX(-900px) skewX(-18deg)} 35%,100%{transform:translateX(1080px) skewX(-18deg)} }
  .sheen { animation: act-glass-dark-sweep 7s cubic-bezier(.4,0,.2,1) infinite; }
  
  @keyframes act-glass-dark-rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .rise { animation: act-glass-dark-rise .8s cubic-bezier(.2,.7,.2,1) both; }
  .d1{animation-delay:.1s} .d2{animation-delay:.25s} .d3{animation-delay:.4s} .d4{animation-delay:.55s} .d5{animation-delay:.7s} .d6{animation-delay:.85s}
  text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif; }
</style>
<rect width="900" height="200" rx="24" fill="url(#act-glass-dark-bg)"/>
