<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="196" viewBox="0 0 900 196" role="img">

<defs>
  <linearGradient id="stack-clay-light-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9edff"/><stop offset="1" stop-color="#fbeefc"/></linearGradient>
  <filter id="stack-clay-light-clay" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="sRGB">
    <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
    <feGaussianBlur in="inv" stdDeviation="7" result="b1"/><feOffset in="b1" dx="-6" dy="-6" result="o1"/>
    <feFlood flood-color="#2a3577" flood-opacity="0.22" result="c1"/><feComposite in="c1" in2="o1" operator="in" result="s1"/><feComposite in="s1" in2="SourceAlpha" operator="in" result="innerDark"/>
    <feGaussianBlur in="inv" stdDeviation="7" result="b2"/><feOffset in="b2" dx="6" dy="6" result="o2"/>
    <feFlood flood-color="#ffffff" flood-opacity="0.95" result="c2"/><feComposite in="c2" in2="o2" operator="in" result="s2"/><feComposite in="s2" in2="SourceAlpha" operator="in" result="innerLight"/>
    <feDropShadow in="SourceGraphic" dx="10" dy="12" stdDeviation="11" flood-color="#6d7cff" flood-opacity="0.28" result="outer"/>
    <feMerge><feMergeNode in="outer"/><feMergeNode in="innerLight"/><feMergeNode in="innerDark"/></feMerge>
  </filter>
  <filter id="stack-clay-light-clayS" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="sRGB">
    <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
    <feGaussianBlur in="inv" stdDeviation="3.15" result="b1"/><feOffset in="b1" dx="-2.7" dy="-2.7" result="o1"/>
    <feFlood flood-color="#2a3577" flood-opacity="0.22" result="c1"/><feComposite in="c1" in2="o1" operator="in" result="s1"/><feComposite in="s1" in2="SourceAlpha" operator="in" result="innerDark"/>
    <feGaussianBlur in="inv" stdDeviation="3.15" result="b2"/><feOffset in="b2" dx="2.7" dy="2.7" result="o2"/>
    <feFlood flood-color="#ffffff" flood-opacity="0.95" result="c2"/><feComposite in="c2" in2="o2" operator="in" result="s2"/><feComposite in="s2" in2="SourceAlpha" operator="in" result="innerLight"/>
    <feDropShadow in="SourceGraphic" dx="4.5" dy="5.4" stdDeviation="4.95" flood-color="#6d7cff" flood-opacity="0.28" result="outer"/>
    <feMerge><feMergeNode in="outer"/><feMergeNode in="innerLight"/><feMergeNode in="innerDark"/></feMerge>
  </filter>
  <clipPath id="stack-clay-light-clip"><rect width="900" height="196" rx="28"/></clipPath>
</defs>
<style>
  @keyframes stack-clay-light-float0 { 0%,100%{transform:translate(0,0) rotate(0deg)} 50%{transform:translate(18px,-22px) rotate(8deg)} }
  @keyframes stack-clay-light-float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-24px,16px)} }
  @keyframes stack-clay-light-float2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(12px,20px) scale(1.08)} }
  @keyframes stack-clay-light-float3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-14px,-18px)} }
  .k0{animation:stack-clay-light-float0 9s ease-in-out infinite} .k1{animation:stack-clay-light-float1 11s ease-in-out infinite}
  .k2{animation:stack-clay-light-float2 13s ease-in-out infinite} .k3{animation:stack-clay-light-float3 10s ease-in-out infinite}
  @keyframes stack-clay-light-squish { 0%,100%{transform:scale(1,1)} 50%{transform:scale(1.03,0.97)} }
  .squish { transform-box: fill-box; transform-origin: center; animation:stack-clay-light-squish 4s ease-in-out infinite; }
  
  @keyframes stack-clay-light-rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .rise { animation: stack-clay-light-rise .8s cubic-bezier(.2,.7,.2,1) both; }
  .d1{animation-delay:.1s} .d2{animation-delay:.25s} .d3{animation-delay:.4s} .d4{animation-delay:.55s} .d5{animation-delay:.7s} .d6{animation-delay:.85s}
  text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif; }
</style>
<rect width="900" height="196" rx="28" fill="url(#stack-clay-light-bg)"/>
<g clip-path="url(#stack-clay-light-clip)"></g>
<rect x="16" y="16" width="868" height="164" rx="30" fill="#f5f7ff" filter="url(#stack-clay-light-clay)"/>
