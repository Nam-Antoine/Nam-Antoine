# Regenerates the liquid-glass README cards and the contribution snake,
# then publishes them to the `output` branch (README.md points there).
name: cards

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 10:17 Hanoi
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/cards.yml"]

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render glass cards
        run: node scripts/build-cards.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Nam-Antoine
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#8ccbff
            dist/snake-light.svg?palette=github-light&color_snake=#1155BC
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: regenerate cards"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
